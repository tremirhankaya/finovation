spring:
  application:
    name: finovation

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:15h}

auth:
  password-reset:
    secret: ${PASSWORD_RESET_SECRET:${JWT_SECRET}}
    sender: ${MAIL_FROM:${MAIL_USERNAME:}}
    otp-expiration: ${PASSWORD_RESET_OTP_EXPIRATION:10m}
    reset-token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION:10m}
    resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:1m}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    ip-rate-limit:
      request-window: ${PASSWORD_RESET_REQUEST_IP_WINDOW:1m}
      request-max-attempts: ${PASSWORD_RESET_REQUEST_IP_MAX_ATTEMPTS:5}
      verify-window: ${PASSWORD_RESET_VERIFY_IP_WINDOW:1m}
      verify-max-attempts: ${PASSWORD_RESET_VERIFY_IP_MAX_ATTEMPTS:10}
  login-rate-limit:
    window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
