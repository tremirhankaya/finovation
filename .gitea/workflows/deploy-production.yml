name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: finovation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Create a source archive
        shell: bash
        env:
          RELEASE_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=finovation-release.tar.gz "$RELEASE_SHA"

      - name: Configure restricted SSH access
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload the release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          RELEASE_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "upload $RELEASE_SHA" \
            < finovation-release.tar.gz

      - name: Activate the release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          RELEASE_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_SHA"
