global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: "null"
  group_by: [environment, service, component, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: slack-alerts
      matchers:
        - severity="critical"
      group_wait: 10s
      repeat_interval: 1h

    - receiver: slack-alerts
      matchers:
        - severity="warning"
      repeat_interval: 4h

receivers:
  - name: "null"

  - name: slack-alerts
    slack_configs:
      - api_url_file: /run/secrets/alertmanager_slack_webhook_url
        channel: "#alerts"
        send_resolved: true
        title: '{{ template "slack.finovation.title" . }}'
        text: '{{ template "slack.finovation.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [environment, service, component, alertname]

  - source_matchers:
      - alertname="BackendDown"
    target_matchers:
      - severity="warning"
    equal: [environment, service]
