rule_files:
  - ../rules/application.rules.yml

evaluation_interval: 1m

tests:
  - name: BackendDown fires after two minutes
    interval: 1m
    input_series:
      - series: 'up{job="finovation-backend"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackendDown
        exp_alerts:
          - exp_labels:
              job: finovation-backend
              severity: critical
              service: finovation-backend
              component: api
              team: finovation
            exp_annotations:
              summary: Finovation backend erişilemiyor
              description: Prometheus en az 2 dakikadır backend metrik endpoint'ine erişemiyor.

  - name: HighHttp5xxRatio ignores a single error and fires on sustained failures
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="finovation-backend",status="200"}'
        values: '0+90x11'
      - series: 'http_server_requests_seconds_count{job="finovation-backend",status="500"}'
        values: '0+10x11'
    alert_rule_test:
      - eval_time: 6m
        alertname: HighHttp5xxRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              service: finovation-backend
              component: api
              team: finovation
            exp_annotations:
              summary: Backend 5xx oranı yükseldi
              description: Son 5 dakikada yeterli trafik altında 5xx oranı %5 eşiğini aştı.
