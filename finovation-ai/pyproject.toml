[project]
name = "ml-fund-engine-frozen-api"
version = "1.0.0"
description = "Frozen V3 equity forecast and portfolio decision HTTP service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost==1.2.8",
  "fastapi==0.141.1",
  "gymnasium==1.3.0",
  "lightgbm==4.6.0",
  "matplotlib==3.11.1",
  "numpy==2.3.2",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "pyarrow==23.0.1",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.16.3",
  "stable-baselines3==2.9.0",
  "tabulate==0.9.0",
  "torch==2.13.0",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
