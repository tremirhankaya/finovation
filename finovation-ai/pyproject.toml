[project]
name = "ml-fund-engine-frozen-api"
version = "1.0.0"
description = "Frozen V3 equity forecast and portfolio decision HTTP service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost==1.2.8",
  "fastapi==0.141.1",
  "lightgbm==4.6.0",
  "numpy==2.3.2",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "pyarrow==23.0.1",
  "scikit-learn==1.9.0",
  "scipy==1.16.3",
  "tabulate==0.9.0",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
