name: finovation

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: finovation-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - finovation_mssql_data:/var/opt/mssql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s


  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: finovation-sqlserver-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-finovation}

    restart: "no"

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Creating database if it does not exist: $$DB_NAME"

        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME];"

        echo "Database ready: $$DB_NAME"


  redis:
    image: redis:7-alpine
    container_name: finovation-redis

    ports:
      - "6380:6379"

    volumes:
      - finovation_redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./finovation-be
      dockerfile: Dockerfile

    container_name: finovation-backend

    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME:-finovation};encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-15h}

    ports:
      - "8080:8080"

    expose:
      - "8081"

    depends_on:
      sqlserver:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./finovation-fe
      dockerfile: Dockerfile

    container_name: finovation-frontend

    environment:
      VITE_API_BASE_URL: /api
      VITE_LOGIN_PATH: /v1/auth/login
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "5173:5173"

    volumes:
      - ./finovation-fe:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: finovation-prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finovation_prometheus_data:/prometheus

    depends_on:
      - backend

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: finovation-grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - finovation_grafana_data:/var/lib/grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  finovation_mssql_data:
  finovation_redis_data:
  finovation_prometheus_data:
  finovation_grafana_data: